[package]
name = "flash-algo-ch5xx"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ch32-rs/flash-algorithms"
authors = [
    "Andelf <andelf@gmail.com>",
]
publish = false

# Standalone workspace so `cargo +nightly build --release` works without
# bootstrapping `ch32-data` and without `xtask` treating `ch5xx` as a CH32
# `algos/*` crate.
#
# Additionally, `flash-algorithm`'s `algorithm!` macro stores a mutable static
# `_IS_INIT` flag in `.bss` using an absolute RAM address (`lui 0x20000`),
# which breaks position-independence on CH571/CH573 (SRAM at `0x20003800`).
# This crate exposes the CMSIS-Pack entry points directly so the resulting
# `code` binary is 100% position-independent across CH570/571/572/573,
# CH581/582/583/584/585, and CH591/592.
[workspace]

# One binary per writable region, named after the datasheet's CODE-area map.
# The two DataFlash variants share `src/data_flash.rs`; they differ only in
# the `0x80000` frame bit and must stay separate binaries because
# `R8_CHIP_ID` collides across the two ISP generations. `data-584x` uses the
# engine's 0-based 512 KiB DataFlash mapping and a 4 KiB erase block.
[[bin]]
name = "code"
test = false
doctest = false
bench = false

[[bin]]
name = "data"
test = false
doctest = false
bench = false

[[bin]]
name = "data-bank"
test = false
doctest = false
bench = false

[[bin]]
name = "data-584x"
test = false
doctest = false
bench = false

[profile.release]
opt-level = "s"
panic = "abort"
